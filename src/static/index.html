<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <div class="account-controls">
          <span id="teacher-status" aria-live="polite">Public view</span>
          <button
            id="auth-button"
            type="button"
            aria-label="Teacher login"
          >👤 Teacher login</button>
        </div>
      </div>
    </header>

    <div id="message" class="hidden" role="status" aria-live="polite"></div>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Teacher: Register a Student</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
      </section>
    </main>

    <div
      id="login-modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="login-title"
    >
      <form id="login-form" class="modal">
        <h3 id="login-title">Teacher Login</h3>
        <div class="form-group">
          <label for="teacher-username">Username:</label>
          <input type="text" id="teacher-username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="teacher-password">Password:</label>
          <input type="password" id="teacher-password" autocomplete="current-password" required />
        </div>
        <div class="modal-actions">
          <button type="submit">Log In</button>
          <button id="cancel-login" class="secondary-button" type="button">Cancel</button>
        </div>
      </form>
    </div>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
